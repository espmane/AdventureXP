<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Booking</title>
    <link rel="stylesheet" href="/booking.css">
    <link rel="stylesheet" href="/navbar.css">
</head>

<body>

<h1>Book en aktivitet</h1>

<div class="container">
    <form id="bookingForm">
        <div>
            <label for="activity">Aktivitet</label><br>
            <select id="activity" required>
                <option value="">Vælg aktivitet…</option>
            </select>
        </div>
        <div>
            <label for="name">Navn</label><br>
            <input type="text" id="name" required>
        </div>
        <div>
            <label for="phone">Telefonnummer</label><br>
            <input type="tel" id="phone" maxlength="8" minlength="8" required>
        </div>
        <div>
            <label for="participants">Antal deltagere</label><br>
            <input type="number" id="participants" min="?" max ="?" step="1" required>
        </div>
        <div>
            <label for="startDate">Start dato</label><br>
            <input type="date" id="startDate" min="?" required>
        </div>
        <div>
            <label for="startTime">Start tid</label><br>
            <input type="time" id="startTime" min="08:00" max="20:00" step="3600" required>
        </div>
        <div>
            <label for="hours">Timer</label>
            <select id="hours" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        <div>
            <label for="company">Firma booking – book alle aktiviteter</label>
            <input type="checkbox" id="company">
        </div>
        <div>
            <p id="totalPrice"></p>
            <button class="create-btn" type="submit">Book</button>
        </div>
    </form>
</div>

<script src="/Login.js"></script>
<script src="/navbar.js"></script>
<script src="/js/booking.js"></script>

</body>
</html>
